# Modèle de configuration du reverse proxy : les __VARIABLES__ sont remplacées
# au démarrage par entrypoint.sh à partir des variables d'environnement.
worker_processes __WORKER_PROCESSES__;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections __WORKER_CONNECTIONS__;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size __CLIENT_MAX_BODY_SIZE__;

    # DNS interne de Docker : les noms "backend"/"frontend" sont résolus à
    # chaque requête (valid=10s). Si un conteneur redémarre (nouvelle IP) ou
    # si l'on scale le backend, nginx suit sans redémarrage.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Limitation de débit sur l'API : protège le backend (ressources limitées).
    limit_req_zone $binary_remote_addr zone=api:1m rate=__API_RATE_LIMIT__r/s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    server {
        listen __PORT__;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $backend http://__BACKEND_HOST__:__BACKEND_PORT__;
            proxy_pass $backend;
        }

        location / {
            set $frontend http://__FRONTEND_HOST__:__FRONTEND_PORT__;
            proxy_pass $frontend;
        }
    }
}
