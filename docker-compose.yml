services:
  backend:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8081
    mem_limit: ${BACKEND_MEMORY:-128m}
    cpus: ${BACKEND_CPUS:-0.50}
    restart: unless-stopped

  frontend:
    build: ./frontend
    mem_limit: ${FRONTEND_MEMORY:-128m}
    cpus: ${FRONTEND_CPUS:-0.50}
    restart: unless-stopped

  webserver:
    build: ./webserver
    ports:
      - "${WEBSERVER_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: ${WEBSERVER_MEMORY:-64m}
    cpus: ${WEBSERVER_CPUS:-0.25}
    restart: unless-stopped
