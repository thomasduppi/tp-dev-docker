# Modèle de configuration : les __VARIABLES__ sont remplacées au démarrage par
# entrypoint.sh à partir des variables d'environnement reçues au run.
worker_processes __WORKER_PROCESSES__;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections __WORKER_CONNECTIONS__;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Utilisateur non-root + système de fichiers en lecture seule : les
    # fichiers temporaires vont dans /tmp (tmpfs).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen __PORT__;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Fichiers générés par Vite (nom avec hash) : cache long.
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Application monopage : toute route inconnue renvoie index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
